<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>boopweb</title>
  <meta name="description" content="A self-contained scratchpad running on WebAssembly." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#11111b" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #11111b;
      overscroll-behavior: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a6adc8;
      font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <div id="loading">loading boopweb…</div>
  <noscript>boopweb requires JavaScript and WebAssembly.</noscript>
  <script type="module">
    import init from "./boopweb.js";

    init()
      .then(() => document.getElementById("loading")?.remove())
      .catch((err) => {
        const el = document.getElementById("loading");
        if (el) el.textContent = "failed to start: " + err;
        console.error(err);
      });

    navigator.serviceWorker?.register("/sw.js").catch(console.error);
  </script>
</body>
</html>
