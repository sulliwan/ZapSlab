<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZapSlab</title>
  <meta name="description" content="A self-contained scratchpad running on WebAssembly." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#11111b" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Build id of the app currently loaded; injected by scripts/build_web.sh. -->
  <meta name="zapslab-build" content="__BUILD_ID__" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #11111b;
      overscroll-behavior: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a6adc8;
      font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <div id="loading">loading ZapSlab…</div>
  <noscript>ZapSlab requires JavaScript and WebAssembly.</noscript>
  <script type="module">
    import init from "./zapslab.js";

    // gpui's web backend calls preventDefault() on every `contextmenu` event at
    // its canvas, which suppresses the browser's native right-click menu. The
    // canvas is appended to <body> and the listener is bubble-phase, so stopping
    // propagation during the window's capture phase keeps the event from ever
    // reaching it. Stopping propagation does not cancel the event, so the
    // browser's normal context menu still opens.
    window.addEventListener("contextmenu", (event) => event.stopPropagation(), true);

    // Every deploy publishes the wasm content hash in /version.json. Compare it
    // with the id this page booted with whenever the app regains focus or
    // visibility, and hand a mismatch to the wasm app, which offers a confirmed
    // reload. Re-posting is harmless: the app just keeps its "update available"
    // state set.
    const pageBuild = document.querySelector('meta[name="zapslab-build"]')?.content;
    async function checkForUpdate() {
      if (!pageBuild) return;
      try {
        const res = await fetch("/version.json", { cache: "no-store" });
        if (!res.ok) return;
        const info = await res.json();
        if (info && info.build && info.build !== pageBuild) {
          window.postMessage(
            {
              type: "zapslab-update-available",
              version: info.version ?? null,
              build: info.build,
            },
            location.origin
          );
        }
      } catch (_) {
        // Offline or version.json missing: retry on the next focus.
      }
    }
    window.addEventListener("focus", checkForUpdate);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkForUpdate();
    });

    init()
      .then(() => {
        document.getElementById("loading")?.remove();
        // The message listener is registered while the view is constructed, so
        // the first check can run once the app has started.
        checkForUpdate();
      })
      .catch((err) => {
        const el = document.getElementById("loading");
        if (el) el.textContent = "failed to start: " + err;
        console.error(err);
      });

    navigator.serviceWorker?.register("/sw.js").catch(console.error);
  </script>
</body>
</html>
